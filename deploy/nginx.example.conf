# Example nginx setup for production. Replace the three domains below with yours:
#   geo.example.in    → landing page (static files in landing/)
#   api.example.in    → Node backend (npm start, port 4000)
#   admin.example.in  → admin panel (static files from admin/dist after `npm run build`)
#
# Get free HTTPS certificates with:  sudo certbot --nginx -d geo.example.in -d api.example.in -d admin.example.in
# Then in backend/.env set TRUST_PROXY=1 and
#   CORS_ORIGINS=https://geo.example.in,https://admin.example.in
#   TURNSTILE_HOSTNAMES=geo.example.in
# and in landing/config.js set window.TS_API_URL = 'https://api.example.in';
#
# If you put Cloudflare's proxy (orange cloud) in front, also restore the real visitor IP
# so rate limits work: see https://developers.cloudflare.com/support/troubleshooting/restoring-visitor-ips/

# ---- Rate-limit zones (per visitor IP), on top of the limits inside the API ----
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_forms:10m   rate=10r/m;
limit_req_status 429;

# Shared security headers
map $host $hsts { default "max-age=31536000; includeSubDomains"; }

# Redirect all plain HTTP to HTTPS
server {
  listen 80;
  server_name geo.example.in api.example.in admin.example.in;
  return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------- Landing page
server {
  listen 443 ssl http2;
  server_name geo.example.in;
  # ssl_certificate / ssl_certificate_key are added by certbot

  root /var/www/geo-landing;   # copy the landing/ folder here
  index index.html;
  server_tokens off;
  client_max_body_size 1k;     # the page is static; nothing is uploaded to it

  # Content Security Policy: only the services the page actually uses may load code or frames.
  # Razorpay (checkout), Cloudflare Turnstile (CAPTCHA), YouTube (videos), Google Fonts.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.razorpay.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com https://*.razorpay.com; frame-src https://*.razorpay.com https://www.youtube-nocookie.com https://challenges.cloudflare.com; connect-src 'self' https://api.example.in https://*.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security $hsts always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://api.razorpay.com\")" always;

  # Only GET/HEAD make sense for a static page
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }

  # Never serve hidden files (.git, .env …)
  location ~ /\. { deny all; return 404; }

  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.(css|js|png|jpg|jpeg|webp|svg)$ {
    expires 7d;
    add_header Cache-Control "public";
    # add_header in a location replaces the server-level ones, so repeat the key headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $hsts always;
  }
}

# ---------------------------------------------------------------- API
server {
  listen 443 ssl http2;
  server_name api.example.in;
  server_tokens off;
  client_max_body_size 32k;    # the API only accepts small JSON bodies
  client_body_timeout 10s;
  client_header_timeout 10s;

  add_header Strict-Transport-Security $hsts always;

  location ~ /\. { deny all; return 404; }

  # Registration and payment endpoints: tight per-IP limit
  location ~ ^/api/(registrations|payments/order)$ {
    limit_req zone=api_forms burst=5 nodelay;
    proxy_pass http://127.0.0.1:4000;
    include /etc/nginx/proxy_params;   # sets Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto
  }

  # Admin API: optionally allow only your office / home IPs (uncomment and edit)
  location /api/admin/ {
    # allow 203.0.113.10;   # office
    # allow 198.51.100.25;  # home
    # deny all;
    limit_req zone=api_general burst=20 nodelay;
    proxy_pass http://127.0.0.1:4000;
    include /etc/nginx/proxy_params;
  }

  location /api/ {
    limit_req zone=api_general burst=20 nodelay;
    proxy_pass http://127.0.0.1:4000;
    include /etc/nginx/proxy_params;
  }

  location / { return 404; }
}

# ---------------------------------------------------------------- Admin panel
server {
  listen 443 ssl http2;
  server_name admin.example.in;
  root /var/www/geo-admin;     # copy admin/dist here
  index index.html;
  server_tokens off;

  # Keep the admin panel out of search engines
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.example.in; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header Strict-Transport-Security $hsts always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # Strongest protection: only your IPs can even open the admin panel (uncomment and edit)
  # allow 203.0.113.10;
  # allow 198.51.100.25;
  # deny all;

  location ~ /\. { deny all; return 404; }
  location / { try_files $uri /index.html; }
}
